name: Document API image build

on:
  pull_request:
    branches: [main]
    paths:
      - 'Legacy.Maliev.DocumentService.Api/Dockerfile'
      - '.github/workflows/document-image-build.yml'
      - 'scripts/document-image-deadline-public.py'
      - 'scripts/test-document-image-deadline-public.py'
      - 'scripts/document-runtime-deadline.py'
      - 'scripts/test-document-runtime-deadline.py'
  push:
    branches: [main]
    paths:
      - 'Legacy.Maliev.DocumentService.Api/Dockerfile'
      - '.github/workflows/document-image-build.yml'
      - 'scripts/document-image-deadline-public.py'
      - 'scripts/test-document-image-deadline-public.py'
      - 'scripts/document-runtime-deadline.py'
      - 'scripts/test-document-runtime-deadline.py'

permissions:
  contents: read

jobs:
  image-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: b3e2881d079c675bcaa7bb23511bcaaffc789cce
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out pinned CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Admit current job receipt ownership
        id: receipt_preflight
        shell: bash
        run: |
          set -euo pipefail
          for file in document-image-id document-image-settled document-image-build-started document-image-build.log document-image-remove-invoked document-image-remove-settled document-startup-cid document-startup-create-output document-startup-inspect.json document-startup-isolation.json document-startup-create-invoked document-startup-create-settled document-startup-start-invoked document-startup-start-settled document-startup-probe-invoked document-startup-probe-output document-startup-probe-state.json document-startup-probe-settled document-startup-stop-invoked document-startup-stop-settled document-startup-remove-invoked document-startup-remove-settled document-startup-cleaned; do
            test ! -e "$RUNNER_TEMP/$file"
            test ! -L "$RUNNER_TEMP/$file"
          done
          sentinel="$RUNNER_TEMP/document79-receipts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -- "$sentinel"
          printf 'admitted=true\n' >> "$GITHUB_OUTPUT"
      - name: Verify deadline admission controls
        run: |
          python3 -B scripts/test-document-image-deadline-public.py
          python3 -B scripts/test-document-runtime-deadline.py
      - name: Admit build time with cleanup reserve
        run: python3 scripts/document-image-deadline-public.py build
      - name: Build exact Dockerfile without publishing
        id: build
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C .dependencies/Legacy.Maliev.ServiceDefaults rev-parse HEAD)" = b3e2881d079c675bcaa7bb23511bcaaffc789cce
          test "$(git -C .dependencies/Legacy.Maliev.CompatibilityContracts rev-parse HEAD)" = 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          printf 'Source head=%s tree=%s\n' "$EXPECTED_HEAD" "$(git rev-parse HEAD^{tree})"
          tag="document-image-build:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$RUNNER_TEMP/document-image-id"
          test ! -e "$RUNNER_TEMP/document-image-settled"
          test ! -e "$RUNNER_TEMP/document-image-build-started"
          for marker in document-image-remove-invoked document-image-remove-settled; do
            test ! -e "$RUNNER_TEMP/$marker"
            test ! -L "$RUNNER_TEMP/$marker"
          done
          docker info >/dev/null
          tags="$(docker image ls --format '{{.Repository}}:{{.Tag}}')"
          if grep -Fxq -- "$tag" <<< "$tags"; then
            echo 'Unique run tag already exists; refusing to overwrite' >&2
            exit 1
          fi
          : > "$RUNNER_TEMP/document-image-build-started"
          DOCKER_BUILDKIT=1 docker build --progress=plain --iidfile "$RUNNER_TEMP/document-image-id" \
            --tag "$tag" --file Legacy.Maliev.DocumentService.Api/Dockerfile . 2>&1 | tee "$RUNNER_TEMP/document-image-build.log"
          iid="$(cat "$RUNNER_TEMP/document-image-id")"
          [[ "$iid" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$iid"
          printf '%s\n' "$iid" > "$RUNNER_TEMP/document-image-settled"
          for base in sdk:11.0 aspnet:11.0; do
            matches="$(grep -E "^#[0-9]+ \[[^]]+\] FROM mcr[.]microsoft[.]com/dotnet/${base}@sha256:[0-9a-f]{64}" "$RUNNER_TEMP/document-image-build.log" | grep -Eo "mcr[.]microsoft[.]com/dotnet/${base}@sha256:[0-9a-f]{64}" | sort -u)"
            [[ "$(printf '%s\n' "$matches" | wc -l)" -eq 1 && "$matches" =~ @sha256:[0-9a-f]{64}$ ]]
            printf 'Resolved base: %s\n' "$matches"
          done
          if grep -E '(^|[[:space:]])warning (CS|NU|MSB|NETSDK)[0-9]+' "$RUNNER_TEMP/document-image-build.log"; then
            echo 'Compiler or package warnings found' >&2
            exit 1
          fi
          printf 'Built head=%s image=%s tag=%s\n' "$EXPECTED_HEAD" "$iid" "$tag"
      - name: Admit startup time with cleanup reserve
        run: python3 scripts/document-image-deadline-public.py startup
      - name: Verify isolated application liveness
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          iid="$(cat "$RUNNER_TEMP/document-image-settled")"
          [[ "$iid" =~ ^sha256:[0-9a-f]{64}$ ]]
          owner="document-startup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cidfile="$RUNNER_TEMP/document-startup-cid"
          for suffix in cid create-output inspect.json isolation.json create-invoked create-settled start-invoked start-settled probe-invoked probe-output probe-state.json probe-settled stop-invoked stop-settled remove-invoked remove-settled cleaned; do
            test ! -e "$RUNNER_TEMP/document-startup-$suffix"
          done
          docker info >/dev/null
          names="$(docker ps -a --format '{{.Names}}')"
          if grep -Fxq -- "$owner" <<< "$names"; then
            echo 'Container name already exists; refusing to claim it' >&2
            exit 1
          fi
          : > "$RUNNER_TEMP/document-startup-create-invoked"
          timeout --signal=TERM --kill-after=5s 20s docker create \
            --name "$owner" --label "io.maliev.owner=$owner" \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --cpus 1 --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
            --env ASPNETCORE_ENVIRONMENT=Testing \
            --env ASPNETCORE_URLS=http://127.0.0.1:8080 \
            --env Cache__RedisEnabled=false --env OTEL_EXPORTER_OTLP_ENDPOINT= \
            --env Observability__TracingEnabled=false --env Observability__RuntimeMetricsEnabled=false \
            --env HOME=/tmp --env CORS__AllowedOrigins__0=https://document-startup.example.test \
            --cidfile "$cidfile" "$iid" > "$RUNNER_TEMP/document-startup-create-output"
          cid="$(cat "$cidfile")"
          [[ "$cid" =~ ^[0-9a-f]{64}$ ]]
          test "$(cat "$RUNNER_TEMP/document-startup-create-output")" = "$cid"
          timeout 10s docker inspect "$cid" > "$RUNNER_TEMP/document-startup-inspect.json"
          IID="$iid" OWNER="$owner" CID="$cid" python3 -B - "$RUNNER_TEMP/document-startup-inspect.json" "$RUNNER_TEMP/document-startup-isolation.json" <<'PY'
          import json, os, sys
          rows = json.load(open(sys.argv[1], encoding='utf-8'))
          if len(rows) != 1: raise SystemExit('expected one container')
          c = rows[0]; h = c['HostConfig']; labels = c['Config']['Labels'] or {}
          env = dict(item.split('=', 1) for item in c['Config']['Env'] if '=' in item)
          expected_env = {'DOTNET_ROLL_FORWARD': 'Major', 'ASPNETCORE_ENVIRONMENT': 'Testing', 'ASPNETCORE_URLS': 'http://127.0.0.1:8080',
                          'Cache__RedisEnabled': 'false', 'OTEL_EXPORTER_OTLP_ENDPOINT': '',
                          'Observability__TracingEnabled': 'false', 'Observability__RuntimeMetricsEnabled': 'false',
                          'HOME': '/tmp', 'CORS__AllowedOrigins__0': 'https://document-startup.example.test'}
          ok = (c['Id'] == os.environ['CID'] and c['Image'] == os.environ['IID']
                and c['Name'] == '/' + os.environ['OWNER'] and labels.get('io.maliev.owner') == os.environ['OWNER']
                and h['NetworkMode'] == 'none' and h['ReadonlyRootfs'] is True
                and not h.get('Binds') and not h.get('PortBindings')
                and h['Memory'] == 536870912 and h['NanoCpus'] == 1000000000 and h['PidsLimit'] == 128
                and 'ALL' in (h.get('CapDrop') or []) and 'no-new-privileges' in (h.get('SecurityOpt') or [])
                and h.get('Tmpfs') == {'/tmp': 'rw,noexec,nosuid,nodev,size=16m,mode=1777'}
                and (c['Config']['User'] or '').split(':', 1)[0] not in ('', '0', 'root')
                and c['Config']['Entrypoint'] == ['dotnet', 'Legacy.Maliev.DocumentService.Api.dll']
                and all(env.get(key) == value for key, value in expected_env.items())
                and all(m.get('Type') == 'tmpfs' and m.get('Destination') == '/tmp' for m in c['Mounts']))
          if not ok: raise SystemExit('container ownership or isolation mismatch')
          with open(sys.argv[2], 'x', encoding='utf-8') as output:
              json.dump({'containerId': c['Id'], 'imageId': c['Image'], 'owner': os.environ['OWNER'],
                         'networkMode': h['NetworkMode'], 'readOnlyRoot': h['ReadonlyRootfs'],
                         'tmpfs': h['Tmpfs'], 'memory': h['Memory'], 'nanoCpus': h['NanoCpus'],
                         'pidsLimit': h['PidsLimit'], 'user': c['Config']['User'],
                         'noBindsOrPorts': True, 'capDropAll': True, 'noNewPrivileges': True,
                         'syntheticConfigurationMatched': True}, output, sort_keys=True)
          PY
          : > "$RUNNER_TEMP/document-startup-create-settled"
          : > "$RUNNER_TEMP/document-startup-start-invoked"
          timeout --signal=TERM --kill-after=5s 20s docker start "$cid"
          : > "$RUNNER_TEMP/document-startup-start-settled"
          test "$(timeout 10s docker inspect --format '{{.State.Running}}' "$cid")" = true
          test ! -e "$RUNNER_TEMP/document-startup-probe-raw"
          test ! -L "$RUNNER_TEMP/document-startup-probe-raw"
          : > "$RUNNER_TEMP/document-startup-probe-invoked"
          set +e
          timeout --signal=TERM --kill-after=5s 35s docker exec -i "$cid" /bin/bash -s > "$RUNNER_TEMP/document-startup-probe-raw" 2>&1 <<'PROBE'
          set -uo pipefail
          trap 'status=$?; printf "DOCUMENT_PROBE_EXIT=%s\\n" "$status"' EXIT
          printf 'DOCUMENT_PROBE_PHASE=shell-started\n'
          for tool in head od tr; do command -v "$tool" >/dev/null || exit 1; done
          printf 'DOCUMENT_PROBE_PHASE=utilities-present\n'
          grep -Eq '/shared/Microsoft[.]NETCore[.]App/11[.][0-9]+[.][0-9]+/libcoreclr[.]so' /proc/1/maps || exit 1
          printf 'DOCUMENT_PROBE_PHASE=core11-present\n'
          grep -Eq '/shared/Microsoft[.]AspNetCore[.]App/11[.][0-9]+[.][0-9]+/Microsoft[.]AspNetCore[.][^ ]+[.]dll' /proc/1/maps || exit 1
          printf 'DOCUMENT_PROBE_PHASE=aspnet11-present\n'
          for attempt in {1..30}; do
            if { exec 3<>/dev/tcp/127.0.0.1/8080; } 2>/dev/null; then
              printf 'GET /documents/liveness HTTP/1.0\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3
              response="$(head -c 8193 <&3 | od -An -tx1 -v | tr -d ' \n')" || exit 1
              [[ ${#response} -le 16384 && "$response" =~ ^[0-9a-f]+$ ]] || exit 1
              [[ "$response" == 485454502f312e3020323030204f4b0d0a* || "$response" == 485454502f312e3120323030204f4b0d0a* ]] || exit 1
              [[ "$response" == *0d0a0d0a* ]] || exit 1
              headers="${response%%0d0a0d0a*}"
              body="${response#*0d0a0d0a}"
              for ((i=0; i<${#headers}; i+=2)); do
                byte="${headers:i:2}"
                [[ "$byte" =~ ^(09|0a|0d|[2-6][0-9a-f]|7[0-9a-e])$ ]] || exit 1
              done
              [[ "$body" == 4865616c746879 ]] || exit 1
              printf 'DOCUMENT_PROBE_PHASE=liveness-healthy\n'
              exit 0
            fi
            sleep 0.5
          done
          exit 1
          PROBE
          code=$?
          set -e
          printf 'DOCUMENT_DOCKER_EXEC_EXIT=%s\n' "$code" > "$RUNNER_TEMP/document-startup-probe-output"
          grep -Ex 'DOCUMENT_PROBE_PHASE=(shell-started|utilities-present|core11-present|aspnet11-present|liveness-healthy)|DOCUMENT_PROBE_EXIT=[0-9]{1,3}' "$RUNNER_TEMP/document-startup-probe-raw" >> "$RUNNER_TEMP/document-startup-probe-output" || true
          rm -- "$RUNNER_TEMP/document-startup-probe-raw"
          if [[ "$code" -ne 0 ]]; then
            state="$(timeout --signal=TERM --kill-after=2s 10s docker inspect --format '{{.Id}}|{{.Image}}|{{.Name}}|{{index .Config.Labels "io.maliev.owner"}}|{{.State.Running}}|{{.State.OOMKilled}}|{{.State.ExitCode}}|{{.State.Pid}}|{{.HostConfig.Memory}}|{{.HostConfig.PidsLimit}}' "$cid" 2>/dev/null)" || state=""
            DOCUMENT_STATE="$state" DOCUMENT_CID="$cid" DOCUMENT_IID="$iid" DOCUMENT_OWNER="$owner" python3 -B - "$RUNNER_TEMP/document-startup-probe-state.json" <<'PY'
          import json, os, re, sys
          result = {'state': 'unavailable'}
          parts = os.environ['DOCUMENT_STATE'].split('|')
          if (len(parts) == 10 and parts[:4] == [os.environ['DOCUMENT_CID'], os.environ['DOCUMENT_IID'], '/' + os.environ['DOCUMENT_OWNER'], os.environ['DOCUMENT_OWNER']]
                  and all(value in ('true', 'false') for value in parts[4:6])
                  and all(re.fullmatch(r'[0-9]{1,12}', value) for value in parts[6:])):
              result = {'state': 'observed', 'running': parts[4] == 'true', 'oomKilled': parts[5] == 'true',
                        'exitCode': int(parts[6]), 'pid': int(parts[7]), 'memoryBytes': int(parts[8]), 'pidsLimit': int(parts[9])}
          with open(sys.argv[1], 'x', encoding='utf-8') as output:
              json.dump(result, output, sort_keys=True)
          PY
          fi
          if [[ "$code" -eq 124 || "$code" -eq 137 ]] || ! grep -Fxq "DOCUMENT_PROBE_EXIT=$code" "$RUNNER_TEMP/document-startup-probe-output"; then
            echo 'Probe command settlement is unproved' >&2
            exit 1
          fi
          : > "$RUNNER_TEMP/document-startup-probe-settled"
          test "$code" -eq 0
          test "$(timeout 10s docker inspect --format '{{.State.Running}}' "$cid")" = true
          printf 'Liveness HTTP 200 Healthy container=%s image=%s\n' "$cid" "$iid"
      - name: Remove exact owned startup container
        if: always() && steps.receipt_preflight.outputs.admitted == 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/document79-receipts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! test -e "$RUNNER_TEMP/document-startup-create-invoked"; then
            echo 'No container creation was invoked.'
            exit 0
          fi
          test -e "$RUNNER_TEMP/document-startup-create-settled" || { echo 'Container create settlement unproved' >&2; exit 1; }
          if test -e "$RUNNER_TEMP/document-startup-start-invoked"; then
            test -e "$RUNNER_TEMP/document-startup-start-settled" || { echo 'Container start settlement unproved' >&2; exit 1; }
          fi
          if test -e "$RUNNER_TEMP/document-startup-probe-invoked"; then
            test -e "$RUNNER_TEMP/document-startup-probe-settled" || { echo 'Container probe settlement unproved' >&2; exit 1; }
          fi
          cid="$(cat "$RUNNER_TEMP/document-startup-cid")"
          iid="$(cat "$RUNNER_TEMP/document-image-settled")"
          owner="document-startup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$cid" =~ ^[0-9a-f]{64}$ && "$iid" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(timeout 10s docker inspect --format '{{.Image}}|{{.Name}}|{{index .Config.Labels "io.maliev.owner"}}' "$cid")" = "$iid|/$owner|$owner"
          : > "$RUNNER_TEMP/document-startup-stop-invoked"
          timeout --signal=TERM --kill-after=5s 15s docker stop --time 5 "$cid"
          test "$(timeout 10s docker inspect --format '{{.State.Running}}' "$cid")" = false
          : > "$RUNNER_TEMP/document-startup-stop-settled"
          : > "$RUNNER_TEMP/document-startup-remove-invoked"
          timeout --signal=TERM --kill-after=5s 15s docker rm "$cid"
          docker info >/dev/null
          ids="$(docker ps -a --no-trunc --format '{{.ID}}')"
          if grep -Fxq -- "$cid" <<< "$ids"; then echo 'Owned container remains' >&2; exit 1; fi
          : > "$RUNNER_TEMP/document-startup-remove-settled"
          : > "$RUNNER_TEMP/document-startup-cleaned"
          printf 'Removed owned container=%s image=%s\n' "$cid" "$iid"
      - name: Remove exact owned image tag
        if: always() && steps.receipt_preflight.outputs.admitted == 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/document79-receipts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tag="document-image-build:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if test -e "$RUNNER_TEMP/document-startup-create-invoked"; then
            test -e "$RUNNER_TEMP/document-startup-cleaned" || { echo 'Container custody unresolved; retaining image tag' >&2; exit 1; }
          fi
          if ! test -e "$RUNNER_TEMP/document-image-build-started"; then
            echo 'Build was not invoked; no image is owned by this job.'
            exit 0
          fi
          if ! test -s "$RUNNER_TEMP/document-image-settled"; then
            echo 'Build settlement marker absent; daemon/image custody remains unverified' >&2
            exit 1
          fi
          iid="$(cat "$RUNNER_TEMP/document-image-id")"
          [[ "$iid" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(cat "$RUNNER_TEMP/document-image-settled")" = "$iid"
          test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$iid"
          : > "$RUNNER_TEMP/document-image-remove-invoked"
          timeout --signal=TERM --kill-after=5s 15s docker image rm "$tag"
          docker info >/dev/null
          tags="$(docker image ls --format '{{.Repository}}:{{.Tag}}')"
          if grep -Fxq -- "$tag" <<< "$tags"; then
            echo 'Owned image tag remains' >&2
            exit 1
          fi
          : > "$RUNNER_TEMP/document-image-remove-settled"
          printf 'Removed exact tag=%s for image=%s; runner/daemon destruction not asserted\n' "$tag" "$iid"
      - name: Retain bounded startup custody
        timeout-minutes: 2
        if: always() && steps.receipt_preflight.outputs.admitted == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: document-image-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/document-image-id
            ${{ runner.temp }}/document-image-settled
            ${{ runner.temp }}/document-image-build-started
            ${{ runner.temp }}/document-image-remove-invoked
            ${{ runner.temp }}/document-image-remove-settled
            ${{ runner.temp }}/document-startup-cid
            ${{ runner.temp }}/document-startup-create-output
            ${{ runner.temp }}/document-startup-isolation.json
            ${{ runner.temp }}/document-startup-create-invoked
            ${{ runner.temp }}/document-startup-create-settled
            ${{ runner.temp }}/document-startup-start-invoked
            ${{ runner.temp }}/document-startup-start-settled
            ${{ runner.temp }}/document-startup-probe-invoked
            ${{ runner.temp }}/document-startup-probe-output
            ${{ runner.temp }}/document-startup-probe-state.json
            ${{ runner.temp }}/document-startup-probe-settled
            ${{ runner.temp }}/document-startup-stop-invoked
            ${{ runner.temp }}/document-startup-stop-settled
            ${{ runner.temp }}/document-startup-remove-invoked
            ${{ runner.temp }}/document-startup-remove-settled
            ${{ runner.temp }}/document-startup-cleaned
          if-no-files-found: warn
          retention-days: 7
