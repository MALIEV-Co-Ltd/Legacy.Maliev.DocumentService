name: Document runtime11 compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-proof:
    uses: ./.github/workflows/receipt-amount-evidence.yml
  validate:
    name: validate
    needs: contract-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
      DOCUMENT_REQUIRED_RUNTIME_MAJOR: '11'

      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      VSTestCollect: XPlat Code Coverage
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/runner-results
      DOCUMENT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out DocumentService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: b3e2881d079c675bcaa7bb23511bcaaffc789cce
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Check out pinned validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.Workflows
          ref: e3a6093324a24968876782153286f52db8b29fd8
          path: .dependencies/Legacy.Maliev.Workflows
          persist-credentials: false
      - name: Admit preinstalled hosted SDK11
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git -C .dependencies/Legacy.Maliev.Workflows rev-parse HEAD)" = e3a6093324a24968876782153286f52db8b29fd8
          test -x /usr/share/dotnet/dotnet
          /usr/share/dotnet/dotnet --list-sdks | grep -Eq '^11[.]0[.]100 '
          /usr/share/dotnet/dotnet --list-runtimes > "$RUNNER_TEMP/document79-runtimes.txt"
          grep -Eq '^Microsoft[.]NETCore[.]App 11[.]' "$RUNNER_TEMP/document79-runtimes.txt"
          grep -Eq '^Microsoft[.]AspNetCore[.]App 11[.]' "$RUNNER_TEMP/document79-runtimes.txt"
          if grep -Eq '^Microsoft[.](NETCore|AspNetCore)[.]App (1[2-9]|[2-9][0-9])[.]' "$RUNNER_TEMP/document79-runtimes.txt"; then exit 1; fi
          echo 'DOTNET_ROOT=/usr/share/dotnet' >> "$GITHUB_ENV"
          echo /usr/share/dotnet >> "$GITHUB_PATH"
      - name: Verify pinned validation action and admit cleanup time
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 2b0a4e2ff4de724c5ae1aafed3b405701f425e42e1fe53fa0ef5014b8be4c8a0 .dependencies/Legacy.Maliev.Workflows/actions/dotnet-validate/action.yml | sha256sum -c -
          printf '%s  %s\n' 18a8d98d1d4a2e9bc5cc48c89b7c3f5895bfe14ccfb910fa293e5f2b90a89ace .github/actions/document-runtime11-validate/action.yml | sha256sum -c -
          python3 -B scripts/test-document-image-deadline-public.py
          python3 -B scripts/test-document-runtime-deadline.py
          python3 scripts/document-runtime-deadline.py validate
      - name: Validate .NET solution
        timeout-minutes: 30
        uses: ./.github/actions/document-runtime11-validate
        with:
          solution: Legacy.Maliev.DocumentService.slnx
          use-local-maliev-dependencies: 'true'
      - name: Obtain exact candidate contract proof
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: receipt-amount-evidence-${{ env.DOCUMENT_SOURCE_SHA }}
          path: contract-proof
      - name: Gate owned production coverage
        timeout-minutes: 3
        run: python3 scripts/verify-runner-coverage.py runner-results contract-proof/receipt-evidence
      - name: Clean owned private Document diagnostics
        timeout-minutes: 3
        if: always() && github.event_name == 'pull_request' && github.repository == 'MALIEV-Co-Ltd/Legacy.Maliev.DocumentService'
        shell: pwsh
        run: |-
          $privatePath = Join-Path $env:RUNNER_TEMP "document-provenance-Legacy.Maliev.DocumentService.Tests-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & ./Legacy.Maliev.DocumentService.Tests/Evidence/Capture-DocumentCollectorProvenance.ps1 -Phase Cleanup -RepositoryRoot $env:GITHUB_WORKSPACE -PrivateDiagnosticDirectory $privatePath
      - name: Preserve validation evidence
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: document-runtime11-${{ github.sha }}
          path: |-
            runner-results
            ${{ runner.temp }}/document79-runtimes.txt
            Legacy.Maliev.DocumentService.Api/bin/Release/net10.0/Legacy.Maliev.DocumentService.Api.dll
            Legacy.Maliev.DocumentService.Api/bin/Release/net10.0/Legacy.Maliev.DocumentService.Api.pdb
            Legacy.Maliev.DocumentService.Application/bin/Release/net10.0/Legacy.Maliev.DocumentService.Application.dll
            Legacy.Maliev.DocumentService.Application/bin/Release/net10.0/Legacy.Maliev.DocumentService.Application.pdb
            Legacy.Maliev.DocumentService.Tests/bin/Release/net10.0/Legacy.Maliev.DocumentService.Application.dll
            Legacy.Maliev.DocumentService.Tests/bin/Release/net10.0/Legacy.Maliev.DocumentService.Api.dll
          if-no-files-found: warn
          retention-days: 7
