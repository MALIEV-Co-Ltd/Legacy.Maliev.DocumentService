version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    # The API and solution require the unpublished shared ServiceDefaults package.
    # CI validates them from pinned source; Dependabot scans the remaining manifests.
    exclude-paths:
      - Legacy.Maliev.DocumentService.slnx
      - Legacy.Maliev.DocumentService.Api/**
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    ignore:
      - dependency-name: Legacy.Maliev.ServiceDefaults
      - dependency-name: Legacy.Maliev.CompatibilityContracts
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /Legacy.Maliev.DocumentService.Api
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
