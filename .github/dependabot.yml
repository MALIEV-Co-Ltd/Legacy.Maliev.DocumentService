version: 2
updates:
  - package-ecosystem: nuget
    # Scan only project graphs that resolve without the unpublished shared package.
    directories:
      - /Legacy.Maliev.DocumentService.Application
      - /Legacy.Maliev.DocumentService.Domain
      - /Legacy.Maliev.DocumentService.Rendering
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    ignore:
      - dependency-name: Legacy.Maliev.ServiceDefaults
      - dependency-name: Legacy.Maliev.CompatibilityContracts
      # QuestPDF 2026.7.2+ changes rotation behavior; 2026.8.0 also breaks Thai PDF parity.
      - dependency-name: QuestPDF
        versions: ["2026.7.2", "2026.7.3", "2026.8.0"]
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /Legacy.Maliev.DocumentService.Api
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
